<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/adr/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- <title>Andakov Dilmukhan — Frontend</title> -->
    <title>ADR</title>
    <style>
      #app-splash {
        --splash-fg: #0b0f19;
        --splash-accent: #635bff;
        --splash-accent-2: #22c55e;
        --splash-surface: rgba(255, 255, 255, 0.06);
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-items: center;
        font-family: "Onest", ui-sans-serif, system-ui, sans-serif;
        color: var(--splash-fg);
        background:
          radial-gradient(1200px 700px at 18% 8%, rgba(99, 91, 255, 0.45), transparent 58%),
          radial-gradient(900px 600px at 88% 12%, rgba(34, 197, 94, 0.22), transparent 55%),
          radial-gradient(800px 500px at 50% 100%, rgba(56, 189, 248, 0.12), transparent 60%),
          #f8fafc;
        isolation: isolate;
        transition:
          opacity 0.72s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.72s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.72s cubic-bezier(0.22, 1, 0.36, 1);
      }

      html[data-theme='dark'] #app-splash {
        --splash-fg: #e8ecff;
        --splash-accent: #8b87ff;
        --splash-accent-2: #34d399;
        --splash-surface: rgba(255, 255, 255, 0.04);
        background:
          radial-gradient(1100px 720px at 20% 0%, rgba(139, 135, 255, 0.35), transparent 55%),
          radial-gradient(800px 520px at 95% 30%, rgba(52, 211, 153, 0.12), transparent 50%),
          radial-gradient(900px 600px at 40% 100%, rgba(56, 189, 248, 0.08), transparent 55%),
          #050816;
      }

      #app-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      #app-splash.splash--out {
        opacity: 0;
        transform: scale(1.04) translateY(-8px);
        filter: blur(14px) saturate(1.15);
        pointer-events: none;
      }

      .splash__wrap {
        position: relative;
        display: grid;
        place-items: center;
        gap: 28px;
        padding: 48px 40px;
      }

      .splash__halo {
        position: absolute;
        width: min(72vw, 420px);
        height: min(72vw, 420px);
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          var(--splash-accent),
          var(--splash-accent-2),
          rgba(56, 189, 248, 0.55),
          var(--splash-accent)
        );
        opacity: 0.22;
        filter: blur(42px);
        animation: splash-spin 4.2s linear infinite;
      }

      .splash__card {
        position: relative;
        width: min(88vw, 320px);
        aspect-ratio: 1;
        border-radius: 28px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, var(--splash-surface), transparent 55%);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12) inset,
          0 24px 80px rgba(2, 6, 23, 0.18);
        backdrop-filter: blur(18px) saturate(1.4);
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
      }

      html[data-theme='dark'] .splash__card {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 30px 90px rgba(0, 0, 0, 0.55);
      }

      .splash__ring {
        position: absolute;
        inset: 10%;
        border-radius: 22px;
        padding: 1.5px;
        background: linear-gradient(135deg, var(--splash-accent), transparent 42%, var(--splash-accent-2));
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0.85;
        animation: splash-pulse 2.4s ease-in-out infinite;
      }

      .splash__mark {
        font-weight: 800;
        font-size: clamp(2.6rem, 8vw, 3.4rem);
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        display: flex;
        gap: 0.02em;
        background: linear-gradient(120deg, var(--splash-fg) 0%, var(--splash-accent) 48%, var(--splash-accent-2) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .splash__mark span {
        display: inline-block;
        animation: splash-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }

      .splash__mark span:nth-child(1) {
        animation-delay: 0.05s;
      }
      .splash__mark span:nth-child(2) {
        animation-delay: 0.14s;
      }
      .splash__mark span:nth-child(3) {
        animation-delay: 0.23s;
      }

      .splash__bar {
        position: absolute;
        bottom: 18%;
        left: 50%;
        translate: -50% 0;
        width: 46%;
        height: 3px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }

      html[data-theme='dark'] .splash__bar {
        background: rgba(232, 236, 255, 0.1);
      }

      .splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--splash-accent), var(--splash-accent-2));
        animation: splash-shimmer 1.35s ease-in-out infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(18px) rotateX(-22deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotateX(0deg);
        }
      }

      @keyframes splash-shimmer {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash__halo,
        .splash__ring,
        .splash__bar::after {
          animation: none !important;
        }

        .splash__mark span {
          animation: none;
          opacity: 1;
          transform: none;
        }

        #app-splash.splash--out {
          filter: none;
          transform: none;
          transition-duration: 0.22s;
        }
      }
    </style>
    <script type="module" crossorigin src="/adr/assets/index-CKcjMvb-.js"></script>
    <link rel="stylesheet" crossorigin href="/adr/assets/index-ByLkdsSb.css">
  </head>
  <body>
    <div id="app-splash" aria-busy="true" aria-label="Loading">
      <div class="splash__wrap">
        <div class="splash__halo" aria-hidden="true"></div>
        <div class="splash__card">
          <div class="splash__ring" aria-hidden="true"></div>
          <div class="splash__mark" aria-hidden="true">
            <span>A</span><span>D</span><span>R</span>
          </div>
          <div class="splash__bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
  </body>
</html>
